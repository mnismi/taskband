name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/Taskband.exe dist/
          # No config.json beside the exe: it would win over
          # %USERPROFILE%\Taskband\config.json and keep every install's config
          # inside its download folder. The default is baked into the binary.
          Compress-Archive -Path dist/* -DestinationPath "taskband-${{ github.ref_name }}-x86_64-windows.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: taskband-*-x86_64-windows.zip
          generate_release_notes: true
