[package]
name = "winbar"
version = "0.1.0"
edition = "2021"
description = "Highly customizable Windows taskbar with custom plugins"
license = "MIT"
repository = "https://github.com/mnismi/winbar"
readme = "README.md"
keywords = ["taskbar", "windows", "waybar", "statusbar"]
categories = ["gui"]

[[bin]]
name = "Winbar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
json5 = "1"

[build-dependencies]
winresource = "0.1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
]
